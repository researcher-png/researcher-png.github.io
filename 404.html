<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>404 - Look It Up Asshat</title>

<style>

:root {
    --white: #ffffff;
    --glow: rgba(255, 255, 255, 0.7);
}


/* =========================================================
   PAGE
   ========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    background-image: url("404background.png");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    color: var(--white);

    font-family: "Courier New", monospace;

    overflow: hidden;
}


/* =========================================================
   CRT SCREEN
   ========================================================= */

.crt {
    position: relative;

    width: 100vw;
    height: 100vh;

    overflow: hidden;

    display: flex;
    flex-direction: column;
    align-items: center;

    filter:
        contrast(1.05)
        brightness(1.05);

    animation: crt-flicker 0.18s infinite;
}


/* =========================================================
   VERY SUBTLE SCANLINES
   ========================================================= */

.crt::before {
    content: "";

    position: absolute;
    inset: 0;

    pointer-events: none;

    z-index: 100;

    background:
        repeating-linear-gradient(
            to bottom,
            rgba(0, 0, 0, 0) 0px,
            rgba(0, 0, 0, 0) 2px,
            rgba(0, 0, 0, 0.035) 3px,
            rgba(0, 0, 0, 0.035) 4px
        );

    /* Keeps the effect extremely subtle */
    opacity: 0.7;
}


/* =========================================================
   LOGO
   ========================================================= */

.logo {
    position: absolute;

    top: clamp(35px, 7vh, 80px);
    left: clamp(30px, 7vw, 90px);

    width: clamp(150px, 24vw, 300px);

    height: auto;

    filter:
        brightness(1.4)
        drop-shadow(0 0 5px var(--glow));

    z-index: 10;
}


/* =========================================================
   ERROR CONTENT
   ========================================================= */

.error {
    position: absolute;

    top: 50%;
    left: 50%;

    transform:
        translate(-50%, -50%);

    text-align: center;

    width: min(90vw, 900px);

    z-index: 10;
}


/* =========================================================
   404
   ========================================================= */

.code {
    font-size:
        clamp(55px, 9vw, 115px);

    line-height: 0.9;

    letter-spacing: 0.08em;

    margin-bottom:
        clamp(20px, 4vh, 40px);

    /* Slightly out-of-focus CRT appearance */
    filter: blur(0.7px);

    text-shadow:
        0 0 4px white,
        0 0 12px rgba(255, 255, 255, 0.8),

        /* Tiny CRT RGB separation */
        2px 0 0 rgba(255, 0, 0, 0.20),
        -2px 0 0 rgba(0, 255, 255, 0.20);
}


/* =========================================================
   PAGE NOT FOUND
   ========================================================= */

.message {
    font-size:
        clamp(24px, 4vw, 55px);

    line-height: 1.1;

    letter-spacing: 0.08em;

    filter: blur(0.7px);

    text-shadow:
        0 0 4px white,
        0 0 10px rgba(255, 255, 255, 0.65),

        /* Tiny CRT RGB separation */
        2px 0 0 rgba(255, 0, 0, 0.18),
        -2px 0 0 rgba(0, 255, 255, 0.18);
}


/* =========================================================
   BACK HOME
   ========================================================= */

.home {
    display: inline-block;

    margin-top:
        clamp(40px, 7vh, 75px);

    color: white;

    text-decoration: none;

    font-size:
        clamp(20px, 3vw, 38px);

    letter-spacing: 0.12em;

    filter: blur(0.7px);

    text-shadow:
        0 0 5px white,
        0 0 12px rgba(255, 255, 255, 0.7);

    transition:
        opacity 0.15s ease,
        text-shadow 0.15s ease;
}


/* =========================================================
   BACK HOME HOVER
   ========================================================= */

.home:hover {
    opacity: 0.75;

    text-shadow:
        0 0 3px white,
        0 0 25px white;
}


/* =========================================================
   CRT FLICKER
   ========================================================= */

@keyframes crt-flicker {

    0% {
        opacity: 1;
    }

    5% {
        opacity: 0.98;
    }

    10% {
        opacity: 1;
    }

    15% {
        opacity: 0.97;
    }

    20% {
        opacity: 1;
    }

    50% {
        opacity: 0.99;
    }

    52% {
        opacity: 0.94;
    }

    54% {
        opacity: 1;
    }

    75% {
        opacity: 0.98;
    }

    76% {
        opacity: 1;
    }

    100% {
        opacity: 1;
    }
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 600px) {

    .logo {
        top: 35px;
        left: 30px;

        width: 155px;
    }

    .error {
        width: 94vw;
    }

    .message {
        letter-spacing: 0.04em;
    }
}


/* =========================================================
   REDUCED MOTION
   ========================================================= */

@media (prefers-reduced-motion: reduce) {

    .crt {
        animation: none;
    }
}

</style>
</head>


<body>

<div class="crt">

    <!-- YOUR LOGO -->
    <!-- Replace with your actual logo path -->

    <img
        class="logo"
        src="404banner.png"
        alt="Look It Up Asshat"
    >


    <!-- 404 MESSAGE -->

    <main class="error">

        <div class="code">
            404
        </div>

        <div class="message">
            PAGE NOT FOUND
        </div>

        <a
            class="home"
            href="/"
        >
            BACK HOME
        </a>

    </main>

</div>

</body>
</html>
