<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="icon.png">
<title>404 - Look It Up Asshat</title>
<meta name="theme-color" content="#212EF9">

<style>
:root {
    --white: #ffffff;
    --glow: rgba(255, 255, 255, 0.7);
}

@font-face {
    font-family: "Roboto-Regular";
    src: url("Roboto-Regular.ttf") format("truetype");
}


/* =========================================================
   PAGE
   ========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    background-image: url("404background.png");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    color: var(--white);

    font-family: "Roboto-Regular", monospace;

    overflow: hidden;
}


/* =========================================================
   CRT SCREEN
   ========================================================= */

.crt {
    position: relative;

    width: 100vw;
    height: 100vh;

    overflow: hidden;

    display: flex;
    flex-direction: column;
    align-items: center;

    filter:
        contrast(1.05)
        brightness(1.05);

    animation: crt-flicker 0.18s infinite;
}


/* =========================================================
   SCANLINES
   ========================================================= */

.scanlines {
    position: absolute;
    inset: 0;

    pointer-events: none;

    z-index: 1000;

    background:
        repeating-linear-gradient(
            to bottom,
            rgba(0, 0, 0, 0) 0px,
            rgba(0, 0, 0, 0) 2px,
            rgba(0, 0, 0, 0.035) 3px,
            rgba(0, 0, 0, 0.035) 4px
        );

    opacity: 0.9;

    filter: blur(0.1px);

    animation:
        scanline-scroll 12s linear infinite;
}

@keyframes scanline-scroll {

    from {
        background-position: 0 0;
    }

    to {
        background-position: 0 8px;
    }
}


/* =========================================================
   LOGO
   ========================================================= */

.logo {
    position: absolute;

    top: clamp(35px, 7vh, 80px);
    left: clamp(30px, 7vw, 90px);

    width: clamp(150px, 24vw, 300px);

    height: auto;

    filter:
        brightness(1.4)
        drop-shadow(0 0 5px var(--glow));

    z-index: 10;
}


/* =========================================================
   ERROR CONTENT
   ========================================================= */

.error {
    position: absolute;

    top: 50%;
    left: 50%;

    transform:
        translate(-50%, -50%);

    text-align: center;

    width: min(90vw, 900px);

    z-index: 10;
}


/* =========================================================
   404
   ========================================================= */

.code {
    font-size:
        clamp(55px, 9vw, 115px);

    line-height: 0.9;

    color: white;

    letter-spacing: 0.08em;

    margin-bottom:
        clamp(20px, 4vh, 40px);

    filter:
        blur(clamp(0.8px, 0.22vw, 1.6px));

    text-shadow:
        2px 0 0 rgba(255, 0, 0, 0.20),
        -2px 0 0 rgba(0, 255, 255, 0.20);
}


/* =========================================================
   PAGE NOT FOUND
   ========================================================= */

.message {
    font-size:
        clamp(24px, 4vw, 55px);

    color: white;

    line-height: 1.1;

    letter-spacing: 0.08em;

    filter:
        blur(clamp(0.8px, 0.22vw, 1.6px));

    text-shadow:
        2px 0 0 rgba(255, 0, 0, 0.18),
        -2px 0 0 rgba(0, 255, 255, 0.18);
}


/* =========================================================
   BACK HOME
   ========================================================= */

.home {
    display: inline-block;

    margin-top:
        clamp(40px, 7vh, 75px);

    color: white;

    text-decoration: none;

    font-size:
        clamp(20px, 3vw, 38px);

    letter-spacing: 0.12em;

    filter:
        blur(clamp(0.8px, 0.22vw, 1.6px));

    text-shadow:
        2px 0 0 rgba(255, 0, 0, 0.18),
        -2px 0 0 rgba(0, 255, 255, 0.18);

    transition:
        opacity 0.15s ease,
        text-shadow 0.15s ease;
}


/* =========================================================
   BACK HOME HOVER
   ========================================================= */

.home:hover {
    opacity: 0.75;

    text-shadow:
        0 0 6px white,
        0 0 31px white;
}


/* =========================================================
   MUSIC AREA
   ========================================================= */

.music-area {
    position: fixed;

    left: 50%;
    bottom: 25px;

    transform: translateX(-50%);

    width: min(300px, 65vw);

    display: flex;
    flex-direction: column;
    align-items: center;

    z-index: 30;

    pointer-events: none;
}


/* =========================================================
   MUSIC START PROMPT
   ========================================================= */

.music-prompt {
    display: none;

    width: max-content;
    max-width: 90vw;

    margin-bottom: 10px;

    color: white;

    font-size:
        clamp(12px, 1.8vw, 18px);

    letter-spacing: 0.08em;

    text-align: center;

    filter:
        blur(clamp(0.8px, 0.22vw, 1.6px));

    text-shadow:
        2px 0 0 rgba(255, 0, 0, 0.18),
        -2px 0 0 rgba(0, 255, 255, 0.18);
}


/* =========================================================
   MUSIC PROMPT FLASH
   ========================================================= */

.music-prompt.visible {
    display: block;

    animation:
        music-prompt-flash 1.5s steps(1, end) infinite;
}

@keyframes music-prompt-flash {

    0%,
    49.999% {
        opacity: 1;
    }

    50%,
    100% {
        opacity: 0;
    }
}


/* =========================================================
   MUSIC VISUALIZER
   ========================================================= */

.visualizer {
    width: 100%;

    height: 35px;

    display: flex;
    align-items: flex-end;
    justify-content: center;

    gap: 3px;

    pointer-events: none;

    filter:
        blur(1.2px);
}

.visualizer span {
    width: 3px;
    height: 3px;

    min-height: 3px;

    background: white;

    box-shadow:
        2px 0 0 rgba(255, 0, 0, 0.20),
        -2px 0 0 rgba(0, 255, 255, 0.20);

    transition:
        height 0.06s linear;
}


/* =========================================================
   CRT FLICKER
   ========================================================= */

@keyframes crt-flicker {

    0% {
        opacity: 1;
    }

    5% {
        opacity: 0.98;
    }

    10% {
        opacity: 1;
    }

    15% {
        opacity: 0.97;
    }

    20% {
        opacity: 1;
    }

    50% {
        opacity: 0.99;
    }

    52% {
        opacity: 0.94;
    }

    54% {
        opacity: 1;
    }

    75% {
        opacity: 0.98;
    }

    76% {
        opacity: 1;
    }

    100% {
        opacity: 1;
    }
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 600px) {

    .logo {
        top: 35px;
        left: 30px;

        width: 155px;
    }

    .error {
        width: 94vw;
    }

    .message {
        letter-spacing: 0.04em;
    }

    .music-area {
        bottom: 18px;

        width: 65vw;
    }

    .music-prompt {
        width: 90vw;

        font-size: 12px;
    }

    .visualizer {
        height: 28px;

        gap: 2px;

        filter:
            blur(1px);
    }

    .visualizer span {
        width: 2px;
    }

    .music-prompt .desktop-text {
        display: none;
    }

    .music-prompt .mobile-text {
        display: inline;
    }
}


/* =========================================================
   PROMPT TEXT
   ========================================================= */

.mobile-text {
    display: none;
}


/* =========================================================
   REDUCED MOTION
   ========================================================= */

@media (prefers-reduced-motion: reduce) {

    .crt {
        animation: none;
    }
}

</style>
</head>


<body>

<div class="crt">

    <div class="scanlines"></div>

    <img
        class="logo"
        src="404banner.png"
        alt="Look It Up Asshat"
    >


    <!-- =====================================================
         404 MESSAGE
         ===================================================== -->

    <main class="error">

        <div class="code">
            404
        </div>

        <div class="message">
            PAGE NOT FOUND
        </div>

        <a
            class="home"
            href="/"
        >
            BACK HOME
        </a>

    </main>

</div>


<!-- =========================================================
     MUSIC AREA
     ========================================================= -->

<div class="music-area">

    <!-- MUSIC START PROMPT -->

    <div
        class="music-prompt"
        id="musicPrompt"
    >

        <span class="desktop-text">
            PRESS ANY KEY TO START MUSIC
        </span>

        <span class="mobile-text">
            PRESS ANYWHERE TO START MUSIC
        </span>

    </div>


    <!-- MUSIC VISUALIZER -->

    <div
        class="visualizer"
        id="visualizer"
    ></div>

</div>


<!-- =========================================================
     BACKGROUND MUSIC
     ========================================================= -->

<audio id="bgMusic" loop>

    <source
        src="404-music.mp3"
        type="audio/mpeg"
    >

</audio>


<script>

const music =
    document.getElementById("bgMusic");

const visualizer =
    document.getElementById("visualizer");

const musicPrompt =
    document.getElementById("musicPrompt");

music.volume = 0.3;


/* =========================================================
   CREATE VISUALIZER BARS
   ========================================================= */

const barCount = 40;

for (let i = 0; i < barCount; i++) {

    const bar =
        document.createElement("span");

    visualizer.appendChild(bar);
}

const bars =
    visualizer.querySelectorAll("span");


/* =========================================================
   AUDIO ANALYZER
   ========================================================= */

let audioContext;
let analyser;
let source;
let dataArray;
let analyzerStarted = false;


function startVisualizer() {

    if (analyzerStarted)
        return;

    analyzerStarted = true;

    audioContext = new (
        window.AudioContext ||
        window.webkitAudioContext
    )();

    analyser =
        audioContext.createAnalyser();

    analyser.fftSize = 128;

    source =
        audioContext.createMediaElementSource(music);

    source.connect(analyser);

    analyser.connect(
        audioContext.destination
    );

    dataArray =
        new Uint8Array(
            analyser.frequencyBinCount
        );

    animateVisualizer();
}


/* =========================================================
   VISUALIZER ANIMATION
   ========================================================= */

function animateVisualizer() {

    requestAnimationFrame(
        animateVisualizer
    );

    if (!analyser)
        return;

    analyser.getByteFrequencyData(
        dataArray
    );

    bars.forEach((bar, i) => {

        const index =
            Math.floor(
                i *
                dataArray.length /
                bars.length
            );

        const value =
            dataArray[index];

        /*
           Read the actual visualizer height.
           This automatically works for both
           desktop (35px) and mobile (28px).
        */

        const maxHeight =
            visualizer.clientHeight;

        const height =
            Math.max(
                3,
                (value / 255) * maxHeight
            );

        bar.style.height =
            `${height}px`;
    });
}


/* =========================================================
   START MUSIC
   ========================================================= */

function startMusic() {

    music.play()
        .then(() => {

            startVisualizer();

            if (
                audioContext &&
                audioContext.state === "suspended"
            ) {
                audioContext.resume();
            }

            /*
               Music successfully started.
               Immediately remove the prompt.
            */

            musicPrompt.classList.remove("visible");

        })
        .catch(() => {

            /*
               Autoplay was blocked.
               Show the flashing prompt.
            */

            musicPrompt.classList.add("visible");

        });
}


/* =========================================================
   TRY AUTOPLAY
   ========================================================= */

startMusic();


/* =========================================================
   AUTOPLAY FALLBACK
   ========================================================= */

document.addEventListener(
    "click",
    startMusic,
    { once: true }
);

document.addEventListener(
    "touchstart",
    startMusic,
    { once: true }
);

document.addEventListener(
    "keydown",
    startMusic,
    { once: true }
);

</script>

</body>
</html>
